<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Debug HRRR Alignment</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 20px; font-family: monospace; }
        #map { width: 100%; height: 500px; border: 2px solid #000; }
        #debug { margin-top: 20px; padding: 10px; background: #f0f0f0; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h1>Debug Page</h1>
    <div id="debug">
        <h2>Loading Status:</h2>
        <div id="status">Initializing...</div>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const status = document.getElementById('status');

        function log(msg, type = 'info') {
            const div = document.createElement('div');
            div.className = type;
            div.textContent = new Date().toISOString() + ': ' + msg;
            status.appendChild(div);
            console.log(msg);
        }

        log('Starting initialization...', 'info');

        // Initialize map
        try {
            log('Creating map...', 'info');
            const map = L.map('map').setView([64.0, -152.0], 4);

            log('Adding tile layer...', 'info');
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);

            log('Map created successfully!', 'success');

            // Load test data
            log('Fetching test-data.json...', 'info');
            fetch('test-data.json')
                .then(response => {
                    log('Fetch response status: ' + response.status, response.ok ? 'success' : 'error');
                    if (!response.ok) throw new Error('HTTP ' + response.status);
                    return response.json();
                })
                .then(data => {
                    log('JSON parsed successfully!', 'success');
                    log('Keys: ' + Object.keys(data).join(', '), 'info');

                    if (data.western && data.western.bounds) {
                        log('Western bounds: ' + JSON.stringify(data.western.bounds), 'info');

                        const bounds = data.western.bounds;
                        const leafletBounds = [[bounds[1], bounds[0]], [bounds[3], bounds[2]]];

                        log('Adding image overlay...', 'info');
                        L.imageOverlay(data.western.image_url, leafletBounds, {
                            opacity: 0.7
                        }).addTo(map);

                        log('Image overlay added!', 'success');
                    }

                    if (data.boundary_polygon) {
                        log('Adding boundary polygon (' + data.boundary_polygon.length + ' points)...', 'info');
                        const coords = data.boundary_polygon.map(p => [p.lat, p.lon]);
                        L.polygon(coords, {
                            color: 'red',
                            weight: 2,
                            fillOpacity: 0
                        }).addTo(map);
                        log('Boundary polygon added!', 'success');
                    }
                })
                .catch(error => {
                    log('ERROR: ' + error.message, 'error');
                    log('Stack: ' + error.stack, 'error');
                });
        } catch (error) {
            log('CRITICAL ERROR: ' + error.message, 'error');
            log('Stack: ' + error.stack, 'error');
        }
    </script>
</body>
</html>
